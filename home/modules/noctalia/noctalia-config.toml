[osd]
border = false

    [osd.kinds]
    lock_keys = false

[plugins]
enabled = []

[shell]
app_icon_color = "on_surface"
app_icon_colorize = true
button_borders = false
card_borders = false
input_borders = false
lang = "ru"
niri_overview_type_to_launch_enabled = false
password_style = "random"
popup_borders = false
screen_time_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    speed = 0.7500000111758709

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    control_center_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/utyara3/Pictures/Screenshots"
    filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
    remember_last_region = true
    show_cursor = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "command"
        command = "notify-send 'Noctalia' 'Custom session entry'"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "6"
        variant = "default"

    [shell.shadow]
    alpha = 0.99999997764825821

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [
        "opencode",
        "zen-browser",
        "discord",
        "telegram",
        "gimp",
        "libreoffice",
        "neovim",
        "obsidian",
        "vscode",
        "steam",
        "obs",
        "papirus-icons",
        "fzf",
        "lazygit",
        "yazi"
    ]

[wallpaper]
directory = "/home/utyara3/Pictures/Images/Wallpapers"

    [wallpaper.default]
    path = "/home/utyara3/Pictures/Images/Wallpapers/cc_frown.jpg"

    [wallpaper.last]
    path = "/home/utyara3/Pictures/Images/Wallpapers/cc_frown.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/utyara3/Pictures/Images/Wallpapers/cc_frown.jpg"

[widget.battery]
enabled = true

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
