[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.84999998100101948
border = "primary"
center = [ "date", "clock", "caffeine" ]
end = [ "ram", "tray", "network", "bluetooth", "notifications", "volume", "brightness", "battery", "session" ]
margin_edge = 3
margin_ends = 200
panel_overlap = 0
start = [ "launcher", "wallpaper", "workspaces", "media", "audio_visualizer" ]
widget_spacing = 12

[battery]
warning_threshold = 40

    [battery.device."/org/freedesktop/UPower/devices/headset_dev_98_34_8C_F6_6A_1D"]
    warning_threshold = 20

[calendar]

[control_center]
show_shortcut_labels = false
sidebar = "full"
sidebar_section = "full"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "mic_mute"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
launcher_position = "start"
margin_edge = 10
reserve_space = false

[idle]
pre_action_fade_seconds = 5

[location]
address = "Russia, Yaroslavl"
auto_locate = false
latitude = 63.565100000000001
longitude = 53.687399999999997

[lockscreen]
blur_intensity = 0.39999999105930328
blurred_desktop = true

